server:
  port: 8080
  tomcat:
    # 拒收超大请求体时不直接 RST 连接（否则前端只看到 ERR_CONNECTION_RESET）
    max-swallow-size: -1

spring:
  application:
    name: aifanyi-backend
  datasource:
    url: jdbc:mysql://localhost:3306/aifanyi?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:aifanyi123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      # -1 = 不限大小（视频可能很大；真正约束是磁盘空间）
      max-file-size: -1
      max-request-size: -1
      # 临时缓存目录放到与存储同盘（默认 D:），避免默认系统临时盘(C:)空间不足/跨盘拷贝；
      # 同盘时 transferTo 退化为秒级 rename，而非再拷一遍整文件。
      location: ${AIFANYI_STORAGE_ROOT:D:/aifanyi/data}/.uploadtmp

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---- 应用自定义配置 ----
aifanyi:
  jwt:
    # 生产务必用环境变量覆盖；至少 32 字节
    secret: ${AIFANYI_JWT_SECRET:dev-only-secret-change-me-please-32bytes-minimum-0123456789}
    expire-minutes: 1440
  storage:
    # 视频/音频/字幕等文件存储根目录
    root: ${AIFANYI_STORAGE_ROOT:D:/aifanyi/data}
  ffmpeg:
    path: ${FFMPEG_PATH:ffmpeg}
  asr:
    groq:
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
      model: ${GROQ_ASR_MODEL:whisper-large-v3}
      # 超过此字节数自动分块转写（20MB，安全低于 Groq 免费档 25MB；付费档可调高）
      max-chunk-bytes: ${GROQ_MAX_CHUNK_BYTES:20971520}
    local:
      base-url: ${AI_SERVICE_URL:http://localhost:8001}
  # 密钥/Base URL/模型一律存在每用户 user_setting（设置页），不再从环境变量读取
  llm:
    # 推理模型关思维链提速；批大小越大请求数越少；并发越高墙钟越快
    disable-thinking: ${LLM_DISABLE_THINKING:true}
    batch-size: ${LLM_BATCH_SIZE:40}
    concurrency: ${LLM_CONCURRENCY:8}

logging:
  level:
    com.aifanyi: debug
